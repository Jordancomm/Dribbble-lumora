<!DOCTYPE html>
<head>
  <title>Lumora</title>

  <style>
    html {
      height: 100%;
    }
    body {
      min-height: 100%;
      position: relative;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      font-size: 14px;

/*      background: rgb(252, 243, 251);*/
      background: linear-gradient(-90deg, #ea4c892e, transparent);
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

 

header {
    padding: 0 30px;
    box-sizing: border-box;
    height: 50px;
    display: flex;
    justify-content: space-between;
}

.header-logo {
    font-size: 30px;
    font-weight: bold;
    line-height: 50px;
    color: #ea4c89;
    flex: 1 1 0;

    color: #ef72a3;
}

   nav {
    flex: 1 1 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
    
nav li {
    display: inline-block;
    vertical-align: top;
    padding: 8px 15px;
    /* background: white; */
    border-radius: 30px;
    margin-right: 5px;

  color: #ef72a3;
  font-weight: bold;
}

nav ul {
    /* display: inline-block; */
    /* vertical-align: top; */
    background: rgba(244,215,243,0.3);
    padding: 3px 5px;
    border-radius: 16px;
    box-shadow: 0 0 0 1px #faebf9;
    box-sizing: border-box;

  box-shadow: 0 0 0 1px #ea4c892e;
  background: #f9ddeb;
  background: rgb(252, 243, 251);
}

header > div:nth-child(3) {
    flex: 1 1 0;
}



main {
    box-sizing: border-box;
    padding: 0 30px;
    margin-top: 25px;
  font-size: 0;
}

    aside {
    height: calc(100vh - 85px);
    width: 275px;
    box-shadow: 0 0 0 1px #faebf9;
    background: rgba(244, 215, 243, 0.3);
    border-radius: 16px;

      box-shadow: 0 0 0 1px #ea4c892e;

      font-size: 14px;
  display: inline-block;
  vertical-align: top;
  width: 250px;
      background: #f9ddeb;
      background: rgb(252, 243, 251);
}
    main > aside:last-child {
      background: #faf9fb;
      box-shadow: none;
      background: #d8d6d5;
      background: white;
    }
    .events {
      height: 100%;
    }
    .events-title {
      color: #ef72a3;
      font-weight: bold;
      height: 36px;
      line-height: 36px;
      box-sizing: border-box;
      padding-left: 15px;
    }
    .events-body {
      height: calc(100% - 36px);
/*      background: #faf9fb;*/
    }
    
article {
  font-size: 14px;
  display: inline-block;
  vertical-align: top;
  width: calc(100% - 550px);
  margin-left: 25px;
  margin-right: 25px;
}
.widgets {
    padding-top: 10px;
}    
.widgets-title {
    font-weight: bold;
    color: #ea4c89c4;
    margin-left: 15px;
    margin-bottom: 10px;

    color: #ef72a3;
}

.widgets-body {
    min-height: 250px;
    width: calc(100% - 30px);
    margin: 0 auto;
    background: #ea4c891a;
    border-radius: 16px;
    box-shadow: 0 0 0 1px #ea4c892e;
    box-sizing: border-box;
    padding: 10px;

    background: #ea4c890d;
  background: #fae9f3;
}

    section {
  width: 100%;
  border-radius: 16px;
  box-shadow: 0 0 0 1px #f8d5e6;
  background: #f9ddeb;
      background: #fae9f3;
}
    .section-title {
  height: 36px;
  color: #ef72a3;
  font-weight: bold;
  box-sizing: border-box;
  line-height: 36px;
  padding-left: 15px;
}
    .section-body {
  min-height: 250px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 -1px 0 0 #f8d5e6;
      background: rgb(252, 243, 251);
}
  </style>
  
</head>
<body>
  <header>
    <div class='header-logo'>Lumora</div>
    <nav>
      <ul>
        <li>Text</li>
        <li>Text</li>
        <li>Text</li>
      </ul>
    </nav>
    <div></div>
  </header>
  <main>
    <aside>
      <div class='widgets' id='widgets-labels'>
        <div class='widgets-title'>Labels</div>
        <div class='widgets-body'>
          Text
        </div>
      </div>
    </aside>
    <article>
      <section>
        <div class='section-title'>Title</div>
        <div class='section-body'></div>
      </section>
    </article>
    <aside>
      <div class='events'>
        <div class='events-title'>Title</div>
        <div class='events-body'>
          <ul>
            <li>Text</li>
            <li>Text</li>
            <li>Text</li>
          </ul>
        </div>
      </div>
    </aside>
  </main>

</body>
</html>

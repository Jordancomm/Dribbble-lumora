<!DOCTYPE html>
<head>
  <title>Lumora</title>

  <style>
    html {
      height: 100%;
    }
    body {
      min-height: 100%;
      position: relative;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

 

header {
    padding: 0 30px;
    box-sizing: border-box;
    height: 50px;
    display: flex;
    justify-content: space-between;
}

.header-logo {
    font-size: 30px;
    font-weight: bold;
    line-height: 50px;
    color: #ea4c89;
    flex: 1 1 0;
}

   nav {
    flex: 1 1 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
    
nav li {
    display: inline-block;
    vertical-align: top;
    padding: 8px 15px;
    /* background: white; */
    border-radius: 30px;
    margin-right: 5px;
}

nav ul {
    /* display: inline-block; */
    /* vertical-align: top; */
    background: rgba(244,215,243,0.3);
    padding: 3px 5px;
    border-radius: 16px;
    box-shadow: 0 0 0 1px #faebf9;
    box-sizing: border-box;
}

header > div::nth-child(3) {
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
  </style>
  
</head>
<body>
  <header>
    <div class='header-logo'>Lumora</div>
    <nav>
      <ul>
        <li>Text</li>
        <li>Text</li>
        <li>Text</li>
      </ul>
    </nav>
    <div></div>
  </header>
  <main>
    <aside>
      <div class='widgets' id='widgets-labels'>
        <div class='widgets-title'>Labels</div>
        <div class='widgets-body'>
          Text
        </div>
      </div>
    </aside>
    <article>
      
    </article>
  </main>

</body>
</html>

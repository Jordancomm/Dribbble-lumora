<!DOCTYPE html>
<head>
  <title>Lumora</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v7.3.1/css/all.css">
  
  <style>
    html {
      height: 100%;
    }
    body {
      min-height: 100%;
      position: relative;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      font-size: 14px;

/*      background: rgb(252, 243, 251);*/
      background: linear-gradient(-90deg, #ea4c892e, transparent);
      background: linear-gradient(-90deg, #ea4c892e, transparent 500px);

      background: linear-gradient(-90deg,#ffbac6,transparent 500px);
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

 

header {
    padding: 0 30px;
    box-sizing: border-box;
    height: 50px;
    display: flex;
    justify-content: space-between;
}

.header-logo {
    font-size: 30px;
    font-weight: bold;
    line-height: 50px;
    color: #ea4c89;
    flex: 1 1 0;

    color: #ef72a3;
  
    color: #ff758c;
}

   nav {
    flex: 1 1 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
    
nav li {
    display: inline-block;
    vertical-align: top;
    padding: 8px 15px;
    /* background: white; */
    border-radius: 30px;
    margin-right: 5px;

  color: #ef72a3;
  font-weight: bold;

  color: white;
}
    nav ul li:first-child, nav li:hover {
      background: #ff95a9;

      background: linear-gradient(135deg,#ff6985,transparent),linear-gradient(#ffbac6,#ffbac6);
  box-shadow: 0 0 0 1px #ff758c, inset 0 1px 0 0 white;
      cursor: pointer;
    }

nav ul {
    /* display: inline-block; */
    /* vertical-align: top; */
    background: rgba(244,215,243,0.3);
    padding: 3px 5px;
    border-radius: 16px;
    box-shadow: 0 0 0 1px #faebf9;
    box-sizing: border-box;

  box-shadow: 0 0 0 1px #ea4c892e;
  background: #f9ddeb;
  background: rgb(252, 243, 251);

  background: #ffbac6;
  box-shadow: 0 0 0 1px #ff758c;
}

header > div:nth-child(3) {
    flex: 1 1 0;
}



main {
    box-sizing: border-box;
    padding: 0 30px;
    margin-top: 25px;
  font-size: 0;
}

    aside {
    height: calc(100vh - 85px);
    width: 275px;
    box-shadow: 0 0 0 1px #faebf9;
    background: rgba(244, 215, 243, 0.3);
    border-radius: 16px;

      box-shadow: 0 0 0 1px #ea4c892e;

      font-size: 14px;
  display: inline-block;
  vertical-align: top;
  width: 250px;
      background: #f9ddeb;
      background: rgb(252, 243, 251);

      background: #ffbac6;
      box-shadow: 0 0 0 1px #ff758c;

      box-shadow: 0 0 0 1px #ff758c, inset 0 1px 0 0 white;
}
    main > aside:last-child {
      background: #faf9fb;
      box-shadow: none;
      background: #d8d6d5;
      background: white;
    }
    .events {
      height: 100%;
    }
    .events-title {
      color: #ef72a3;
      font-weight: bold;
      height: 36px;
      line-height: 36px;
      box-sizing: border-box;
      padding-left: 15px;

      color: #ff758c;
    }
    .events-body {
      height: calc(100% - 36px);
/*      background: #faf9fb;*/
    }
    .events li {
    width: calc(100% - 30px);
    margin: 0 auto;
    background: #faf9fb;
    height: 50px;
    margin-bottom: 10px;
    border-radius: 10px;
    line-height: 50px;
    box-sizing: border-box;
    padding-left: 15px;

      background: #f0f0f0;
}
    
article {
  font-size: 14px;
  display: inline-block;
  vertical-align: top;
  width: calc(100% - 550px);
  margin-left: 25px;
  margin-right: 25px;
}
.widgets {
    padding-top: 10px;
}    
.widgets-title {
    font-weight: bold;
    color: #ea4c89c4;
    margin-left: 15px;
    margin-bottom: 10px;

    color: #ef72a3;

  color: white;
}

.widgets-body {
    min-height: 250px;
    width: calc(100% - 30px);
    margin: 0 auto;
    background: #ea4c891a;
    border-radius: 16px;
    box-shadow: 0 0 0 1px #ea4c892e;
    box-sizing: border-box;
    padding: 10px;

    background: #ea4c890d;
  background: #fae9f3;

  background: #ff95a9;
  box-shadow: 0 0 0 1px #ff758c;
  color: white;

  box-shadow: 0 0 0 1px #ff758c, inset 0 1px 0 0 white;
}

    section {
  width: 100%;
  border-radius: 16px;
  box-shadow: 0 0 0 1px #f8d5e6;
  background: #f9ddeb;
      background: #fae9f3;

      background: #ff95a9;
  box-shadow: 0 0 0 1px #ff758c;

      background: #ffbac6;
      box-shadow: 0 0 0 1px #ff758c, inset 0 1px 0 0 white;
}
    .section-title {
  height: 36px;
  color: #ef72a3;
  font-weight: bold;
  box-sizing: border-box;
  line-height: 36px;
  padding-left: 15px;

      color: white;
}
    .section-body {
  min-height: 250px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 -1px 0 0 #f8d5e6;
      background: rgb(252, 243, 251);

      background: #ffbac6;
  box-shadow: 0 -1px 0 0 #ff758c;

      background: #ff95a9;
      box-shadow: 0 -1px 0 0 #ff758c, inset 0 1px 0 0 white;

      position: relative;
}


    
.section-table-info > div {
  display: inline-block;
  vertical-align: top;
  background: white;
  padding: 5px 15px;
  border-radius: 10px;
  margin-top: 5px;
}
.section-table-info {
  box-sizing: border-box;
  padding: 0 15px;
}


    
.section-footer {
  position: absolute;
  bottom: 0;
  height: 45px;
  background: #ffbac6;
  left: 0;
  right: 0;
  border-radius: 0 0 16px 16px;
  box-shadow: 0 -1px 0 0 white;
  font-size: 0;
}
.section-footer > div {
  display: inline-block;
  vertical-align: top;
  width: calc(100% - 100px);
  font-size: 14px;
  height: 100%;
}
.section-line-r {
  width: 100px !important;
}
.section-readme span {
  text-align: center;
  font-weight: bold;
  background: #ffbac6;
  padding: 7px 15px;
  color: white;
  border-radius: 8px;
  box-shadow: 0 0 0 1px #ff758c, inset 0 1px 0 0 white;
  background: linear-gradient(135deg,#ff6985,transparent),linear-gradient(#ffbac6,#ffbac6);
}
.section-readme {
  line-height: 45px;
  height: 100%;
  background: white;
  border-radius: 0 0 16px 0;
  text-align: center;
  box-shadow: -1px 0 0 #ff95a9;
}
  </style>
  
</head>
<body>
  <header>
    <div class='header-logo'>Lumora</div>
    <nav>
      <ul>
        <li>Text</li>
        <li>Text</li>
        <li>Text</li>
      </ul>
    </nav>
    <div></div>
  </header>
  <main>
    <aside>
      <div class='widgets' id='widgets-labels'>
        <div class='widgets-title'>Labels</div>
        <div class='widgets-body'>
          Text
        </div>
      </div>
    </aside>
    <article>
      <section>
        <div class='section-title'>Title</div>
        <div class='section-body'>
          <div class='section-table-info'>
            <div class='section-autor'><i class="fa-regular fa-user"></i> Lumora</div>
            <div class='section-date'><i class="fa-regular fa-calendar-days"></i> 22.11.26</div>
          </div>
          <div class='section-footer'>
            <div class='section-line-l'></div>
            <div class='section-line-r'>
              <div class='section-readme'>
                <span>Readme</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </article>
    <aside>
      <div class='events'>
        <div class='events-title'>Events</div>
        <div class='events-body'>
          <ul>
            <li>Text</li>
            <li>Text</li>
            <li>Text</li>
          </ul>
        </div>
      </div>
    </aside>
  </main>

</body>
</html>
